<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040c14" />
      <stop offset="50%" stop-color="#071b12" />
      <stop offset="100%" stop-color="#03070d" />
    </linearGradient>

    <linearGradient id="emeraldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for Mobile & Maskable Icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="4" />

  <!-- Ambient Light Halo -->
  <circle cx="256" cy="250" r="144" fill="rgba(16, 185, 129, 0.09)" />

  <!-- Elegant Islamic Crescent Moon -->
  <path d="M314 128 C384 181 384 309 304 368 C224 426 128 362 128 277 C128 202 181 144 250 128 C213 154 202 256 266 304 C320 341 357 250 314 128 Z"
        fill="url(#emeraldGrad512)" filter="url(#glow512)" />

  <!-- 8-Pointed Star (Najmat al-Quds) -->
  <g transform="translate(336, 181) scale(2.5)" filter="url(#glow512)">
    <polygon points="0,-18 13,-5 18,0 13,5 0,18 -13,5 -18,0 -13,-5" fill="url(#goldGrad512)" />
    <polygon points="0,-18 13,-5 18,0 13,5 0,18 -13,5 -18,0 -13,-5" fill="url(#goldGrad512)" transform="rotate(45)" opacity="0.9" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Minor Celestial Stars -->
  <circle cx="165" cy="138" r="4.5" fill="#fde68a" opacity="0.6" />
  <circle cx="368" cy="341" r="4" fill="#34d399" opacity="0.5" />
  <circle cx="149" cy="330" r="3" fill="#fde68a" opacity="0.4" />
</svg>
